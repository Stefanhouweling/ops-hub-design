<body>

<header class="top">
  <div class="wrap">
    <div class="topRow">
      <div class="brandMark">
        <div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20l6-10 4 6 3-4 5 8z"/><circle cx="17" cy="6" r="2"/></svg></div>
        <div><b>Ops Hub</b><small id="today"></small></div>
      </div>
      <nav class="deskNav">
        <a href="#ok">Approvals</a><a href="#today-sec">Today</a><a href="#team">Team</a><a href="#coming">Calendar</a><a href="#handover">Handover</a><a href="#revenue">Revenue</a>
      </nav>
      <div class="updated" id="updated"><i></i></div>
    </div>
    <div class="seg" role="group" aria-label="Show items for" id="seg">
      <div class="thumb" id="thumb"></div>
    </div>
  </div>
</header>

<main class="wrap" id="home">
  <div class="hero">
    <div class="heroGrid">
      <div class="heroText">
        <div class="eyebrow" id="campName"></div>
        <h1 id="greet"></h1>
        <div style="font-size:14.5px;opacity:.85;line-height:1.45" id="heroSub"></div>
      </div>
      <div>
        <div class="ring">
          <svg width="100%" height="100%" viewBox="0 0 120 120">
            <circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="10"/>
            <circle id="ringArc" cx="60" cy="60" r="52" fill="none" stroke="#F3C26F" stroke-width="10" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7" style="transition:stroke-dashoffset 1s ease"/>
          </svg>
          <div class="c"><div><b id="days"></b><small>days to<br>handover</small></div></div>
        </div>
      </div>
    </div>
    <div class="mustdo" id="mustdo">
      <div class="fl">!</div>
      <div>
        <b id="mustTitle"></b>
        <span id="mustDetail"></span>
        <button data-jump="ok" id="mustCta"></button>
      </div>
    </div>
    <div class="ringCap" id="ringCap" style="position:relative;z-index:1;margin-top:12px"></div>
  </div>

  <div class="tiles">
    <button class="tile" data-jump="ok"><span class="n" id="cOk"></span><span class="l"><i class="dot" style="background:var(--red)"></i>Needs your OK</span><span class="d" id="tileOkD"></span></button>
    <button class="tile" data-jump="today-sec"><span class="n" id="cDo"></span><span class="l"><i class="dot" style="background:var(--accent)"></i>To do</span><span class="d" id="tileDoD"></span></button>
    <button class="tile" data-jump="today-sec"><span class="n" id="cHeads"></span><span class="l"><i class="dot" style="background:var(--alex)"></i>Heads-up</span><span class="d" id="tileHeadsD"></span></button>
    <button class="tile" data-jump="team"><span class="n" id="cBots"></span><span class="l"><i class="dot" style="background:var(--green)"></i>Bots active</span><span class="d" id="cBotsD"></span></button>
  </div>

  <div class="grid">
    <section class="sec full" id="ok">
      <div class="secHead"><h2>Needs your OK</h2><span class="meta" id="okMeta"></span></div>
      <div class="honest"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span id="honestTxt"></span></div>
      <div class="appr" id="apprList"></div>
    </section>

    <section class="sec" id="today-sec">
      <div class="secHead"><h2>Today</h2><span class="meta">Last 48 hours</span></div>
      <div id="todayList"></div>
    </section>

    <section class="sec" id="coming">
      <div class="secHead"><h2>Coming up</h2><span class="meta">Next 14 days +</span></div>
      <div class="tl" id="tl"></div>
      <p class="foot" id="comingFoot"></p>
    </section>

    <section class="sec full" id="team">
      <div class="secHead"><h2>Team</h2><span class="meta" id="teamMeta"></span></div>
      <div class="legend"><span><i class="dot" style="background:var(--green)"></i>Active</span><span><i class="dot" style="background:var(--grey)"></i>Quiet / paused</span><span><i class="dot" style="background:var(--amber)"></i>Waiting on you</span><span style="color:var(--faint)">Tap a bot for details</span></div>
      <div class="team" id="teamGrid"></div>
    </section>

    <section class="sec" id="handover">
      <div class="secHead"><h2>Handover</h2><span class="meta" id="hoMeta"></span></div>
      <div class="prog" style="margin-bottom:12px"><div class="progTop"><b id="hoPct"></b><span id="hoTxt"></span></div><div class="bar"><i id="hoBar"></i></div></div>
      <div class="list" id="hoList"></div>
    </section>

    <section class="sec" id="revenue">
      <div class="secHead"><h2>Revenue Plan</h2><span class="meta" id="revMeta"></span></div>
      <div class="rev" id="revBody"></div>
      <p class="foot" id="revFoot"></p>
    </section>

    <section class="sec" id="board">
      <div class="secHead"><h2>Board &amp; committee</h2></div>
      <div class="list" style="margin-bottom:12px" id="boardEvents"></div>
      <div class="subhead">Open asks for you</div>
      <div class="list" id="askList"></div>
    </section>

    <section class="sec" id="drive">
      <div class="secHead"><h2>Drive review</h2><span class="meta" id="driveMeta"></span></div>
      <div class="prog" id="driveBody"></div>
    </section>

    <section class="sec full" id="links">
      <div class="secHead"><h2>Quick links</h2></div>
      <div class="links" id="linkGrid"></div>
    </section>
  </div>

  <p class="pageFoot" id="pageFoot"></p>
</main>

<nav class="tabs" id="tabs" aria-label="Main navigation">
  <button class="on" data-jump="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-jump="ok"><span class="badge" id="tabBadge"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>Approvals</button>
  <button data-jump="team"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Team</button>
  <button data-jump="coming"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Calendar</button>
  <button data-jump="revenue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 6-7"/></svg>Revenue</button>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"><span class="ok"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></span><span id="toastTxt">Copied</span></div>

<script src="data.js"></script>
<script>
const D = window.OPS_HUB_DATA;
if (!D) throw new Error("data.js did not load. Open this folder over a local server, or keep data.js next to index.html.");

const MONTHS = {Jan:"January",Feb:"February",Mar:"March",Apr:"April",May:"May",Jun:"June",Jul:"July",Aug:"August",Sep:"September",Oct:"October",Nov:"November",Dec:"December"};

const ownerLabel = o => (D.ownerLabels && D.ownerLabels[o]) || o;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ownerClass = o => o === D.owners.primary ? "primary" : o === D.owners.secondary ? "secondary" : "both";
const chip = o => `<span class="chip o-${ownerClass(o)}">${esc(ownerLabel(o))}</span>`;
const unv = t => `<span class="pill p-unv">${esc(t||"Unverified")}</span>`;

const approvals = D.approvals;
const today = D.today;
const bots = D.bots;
const coming = D.coming;
const handover = D.handover;
const asks = D.asks;
const links = D.links;

let view = D.owners.all;
const shows = o => view === D.owners.all || o === view || o === D.owners.both;
const chev = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
const copyIc = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';

function nowDate(){
  return D.now ? new Date(D.now) : new Date();
}

function render(){
  const ap = approvals.filter(a => shows(a.owner));
  document.getElementById("apprList").innerHTML = ap.length ? ap.map(a => `
    <article class="ac ${a.pri==="urgent"?"urgent":""}" id="ac-${a.id}">
      <div class="h">${chip(a.owner)}<span class="pill p-${a.pri}">${esc(a.priLabel)}</span></div>
      <h3>${esc(a.title)}</h3>
      <p>${esc(a.why)}</p>
      ${a.rec?`<div class="rec"><b>${esc(a.rec.label)}</b> ${esc(a.rec.text)}</div>`:""}
      <div class="draft"><div><div class="draftIn">
        <dl class="kv">${a.kv.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
        ${a.draft && a.draft.length?`<ul>${a.draft.map(d=>`<li>${esc(d)}</li>`).join("")}</ul>`:""}
        <div class="note">${a.note?esc(a.note)+" ":""}${a.draft && a.draft.length?esc(D.draftNoteFull):""}</div>
      </div></div></div>
      <div class="acts">
        <button class="btn sec" aria-expanded="false" data-toggle="${a.id}" data-lbl="${a.draft && a.draft.length?"Read draft":"Details"}"><span>${a.draft && a.draft.length?"Read draft":"Details"}</span> ${chev}</button>
        <button class="btn pri" data-copy="${esc(a.phrase)}">${copyIc} Approve</button>
      </div>
      <div class="phrase">Copies <code>${esc(a.phrase)}</code> for the chat</div>
    </article>`).join("") : `<div class="list empty">Nothing waiting on you 🎉</div>`;
  document.getElementById("okMeta").textContent = ap.length + " waiting";

  const td = today.filter(t => shows(t.owner));
  const doI = td.filter(t=>t.kind==="do"), hd = td.filter(t=>t.kind==="heads");
  const row = t => {
    const tags = [];
    if (t.tag) tags.push(`<span class="pill p-low">${esc(t.tag)}</span>`);
    if (t.unverified) tags.push(unv(t.unverified));
    return `<div class="item"><div class="ic" style="background:${t.kind==="do"?"#FDE8E6":"var(--surface2)"}">${t.icon}</div><div class="body"><div class="t">${esc(t.title)}</div><div class="s">${esc(t.detail)}</div><div class="row">${chip(t.owner)}${tags.join("")}</div></div></div>`;
  };
  document.getElementById("todayList").innerHTML =
    (doI.length?`<div class="subhead">To do</div><div class="list">${doI.map(row).join("")}</div>`:"") +
    (hd.length?`<div class="subhead">Heads-up</div><div class="list">${hd.map(row).join("")}</div>`:"") ||
    `<div class="list empty">All clear</div>`;

  const ho = handover.filter(c => shows(c.owner));
  const dn = ho.filter(c=>c.done).length, pct = ho.length?Math.round(dn/ho.length*100):0;
  document.getElementById("hoList").innerHTML = ho.map(c => `<div class="chk ${c.done?"done":""}"><div class="box">${c.done?'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>':""}</div><div><div class="t">${esc(c.t)}</div><div class="s">${chip(c.owner)}<span>${esc(c.m)}</span></div></div></div>`).join("");
  document.getElementById("hoPct").textContent = pct + "%";
  document.getElementById("hoTxt").textContent = `${dn} of ${ho.length} done`;
  document.getElementById("hoBar").style.width = Math.max(pct,3) + "%";
  document.getElementById("ringArc").style.strokeDashoffset = 326.7 * (1 - pct/100);
  document.getElementById("ringCap").innerHTML = `<b style="color:#F3C26F">●</b> ${esc(D.ringCapPrefix)} ${dn} of ${ho.length} steps done${view===D.owners.all?"":" for "+ownerLabel(view)}`;

  const as = asks.filter(a => shows(a.owner));
  document.getElementById("askList").innerHTML = as.map(a => `<div class="item"><div class="body"><div class="t">${esc(a.t)}</div><div class="s">${esc(a.s)}</div><div class="row">${chip(a.owner)}</div></div></div>`).join("") || `<div class="empty">None</div>`;

  document.getElementById("cOk").textContent = ap.length;
  document.getElementById("cDo").textContent = doI.length;
  document.getElementById("cHeads").textContent = hd.length;
  document.getElementById("tabBadge").textContent = ap.length;
  document.getElementById("tabBadge").classList.toggle("hide", !ap.length);
  const hr = +new Intl.DateTimeFormat("en-GB",{hour:"numeric",hourCycle:"h23",timeZone:D.timeZone}).format(nowDate());
  const g = hr<12?"Good morning":hr<17?"Good afternoon":"Good evening";
  document.getElementById("greet").textContent = view===D.owners.all ? `${g}, ${D.directorsTogether}` : `${g}, ${ownerLabel(view)}`;
  document.getElementById("mustdo").classList.toggle("hide", view===D.mustDo.hideFor);
  bindDyn();
}

function renderStatic(){
  document.getElementById("teamGrid").innerHTML = bots.map((b,i) => `
    <button class="bot" aria-expanded="false" data-bot="${i}">
      <div class="top2"><div class="em">${b.em}</div><div class="st"><i class="dot" style="background:var(--${b.c})"></i>${esc(b.st)}</div></div>
      <b>${esc(b.name)}</b>
      <div class="last">${esc(b.last)}</div>
      ${b.wait?'<span class="wait">● Waiting on you</span>':""}
      <div class="more"><small>Working on</small><p>${esc(b.doing)}</p><small>Waiting on</small><p style="margin:0">${esc(b.waiting)}</p></div>
    </button>`).join("");
  const act = bots.filter(b=>b.c==="green").length;
  document.getElementById("cBots").textContent = act;
  document.getElementById("cBotsD").textContent = `of ${bots.length} specialists`;
  document.getElementById("teamMeta").textContent = `${bots.length} specialist bots`;
  document.querySelectorAll(".bot").forEach(el => el.onclick = () => { el.classList.toggle("open"); el.setAttribute("aria-expanded", el.classList.contains("open")); });

  let lastM = "";
  document.getElementById("tl").innerHTML = coming.map(e => { const hdr = e.m!==lastM ? `<div class="mon">${MONTHS[e.m]||e.m}</div>` : ""; lastM=e.m;
    return hdr + `<div class="ev"><div class="date ${e.hl?"hl":""}"><small>${e.d==="~"?"About":esc(e.d)}</small><b>${esc(e.n)}</b></div><div style="min-width:0"><div class="t">${esc(e.t)}</div><div class="s">${esc(e.s)}</div>${e.unv?`<div style="margin-top:6px">${unv()}</div>`:""}</div></div>`; }).join("");

  document.getElementById("linkGrid").innerHTML = links.map(([i,t,s,h]) => `<a class="lk" href="${esc(h)}" target="_blank" rel="noopener"><span class="li">${i}</span><div><b>${esc(t)}</b><small>${esc(s)}</small></div></a>`).join("");
}

function renderChrome(){
  document.title = D.docTitle;
  document.getElementById("campName").textContent = D.campName;
  document.getElementById("heroSub").textContent = D.heroSub;
  document.getElementById("updated").innerHTML = `<i></i>${esc(D.updatedLabel)}`;
  document.getElementById("mustTitle").textContent = D.mustDo.title;
  document.getElementById("mustDetail").textContent = D.mustDo.detail;
  document.getElementById("mustCta").textContent = D.mustDo.cta;
  document.getElementById("mustCta").dataset.jump = D.mustDo.jump;
  document.getElementById("tileOkD").textContent = D.tiles.okDetail;
  document.getElementById("tileDoD").textContent = D.tiles.doDetail;
  document.getElementById("tileHeadsD").textContent = D.tiles.headsDetail;
  document.getElementById("honestTxt").textContent = D.honest;
  document.getElementById("comingFoot").textContent = D.comingFoot;
  document.getElementById("hoMeta").textContent = "to " + D.handoverLabel;
  document.getElementById("pageFoot").innerHTML = esc(D.snapshot).replace(/\n/g,"<br>");

  const seg = document.getElementById("seg");
  const colors = { [D.owners.primary]:"var(--alex)", [D.owners.secondary]:"var(--sam)" };
  const opts = [D.owners.all, D.owners.primary, D.owners.secondary];
  opts.forEach((v,i) => {
    const b = document.createElement("button");
    if (i===0) b.className = "on";
    b.dataset.v = v;
    b.setAttribute("aria-pressed", i===0);
    b.innerHTML = colors[v] ? `<span class="sw" style="background:${colors[v]}"></span>${esc(ownerLabel(v))}` : esc(ownerLabel(v));
    seg.appendChild(b);
  });

  const R = D.revenue;
  document.getElementById("revMeta").textContent = R.meta;
  document.getElementById("revBody").innerHTML = `
    <div class="big">
      <div><small>${esc(R.lastYearLabel)}</small><b>${esc(R.lastYearAmount)}</b><span>${esc(R.lastYearNote)}</span></div>
      <div><small>${esc(R.seasonLabel)}</small><b>${esc(R.seasonAmount)}</b><span>${esc(R.seasonNote)}</span></div>
    </div>
    <svg class="chart" viewBox="0 0 340 128" width="100%" role="img" aria-label="${esc(R.chartLabel)}">
      <defs><linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#2E6B50"/><stop offset="1" stop-color="#5DBB8A"/></linearGradient></defs>
      <text x="0" y="14">${esc(R.targetLabel)}</text><text class="v" x="340" y="14" text-anchor="end">${esc(R.targetAmount)}</text>
      <rect x="0" y="22" width="340" height="14" rx="7" fill="var(--surface2)"/><rect x="0" y="22" width="340" height="14" rx="7" fill="none" stroke="var(--faint)" stroke-dasharray="4 4"/>
      <text x="0" y="58">${esc(R.lastYearLabel)}</text><text class="v" x="340" y="58" text-anchor="end">${esc(R.lastYearPctLabel)}</text>
      <rect x="0" y="66" width="340" height="14" rx="7" fill="var(--surface2)"/><rect class="grow" x="0" y="66" width="${R.lastYearBar}" height="14" rx="7" fill="url(#g1)"/>
      <text x="0" y="102">${esc(R.seasonLabel)}</text><text class="v" x="340" y="102" text-anchor="end">${esc(R.seasonPctLabel)}</text>
      <rect x="0" y="110" width="340" height="14" rx="7" fill="var(--surface2)"/><rect class="grow" x="0" y="110" width="${R.seasonBar}" height="14" rx="7" fill="#E9A23B"/>
    </svg>
    <div class="kvList">
      ${R.kv.map(row => {
        const [k,v,kind] = row;
        return `<div${kind==="multi"?' class="st"':""}><span>${esc(k)}</span><b>${esc(v).replace(/\n/g,"<br>")}</b></div>`;
      }).join("")}
    </div>`;
  document.getElementById("revFoot").textContent = R.foot;

  document.getElementById("boardEvents").innerHTML = D.boardEvents.map(e =>
    `<div class="ev"><div class="date${e.hl?" hl":""}"><small>${esc(e.month)}</small><b>${esc(e.day)}</b></div><div><div class="t">${esc(e.title)}</div><div class="s">${esc(e.sub)}</div></div></div>`
  ).join("");

  const Dr = D.drive;
  document.getElementById("driveMeta").textContent = Dr.meta;
  document.getElementById("driveBody").innerHTML = `
    <div class="progTop"><b>${esc(String(Dr.pct))}%</b><span>${esc(Dr.doneLabel)}</span></div>
    <div class="bar"><i style="width:${Dr.pct}%"></i></div>
    <div class="big" style="margin-top:16px;grid-template-columns:repeat(3,1fr)">
      <div><small>Reviewed</small><b style="font-size:22px">${esc(Dr.reviewed)}</b></div>
      <div><small>To read</small><b style="font-size:22px">${esc(Dr.toRead)}</b></div>
      <div><small>Media</small><b style="font-size:22px">${esc(Dr.media)}</b><span>not counted</span></div>
    </div>
    <p class="foot" style="margin:14px 0 0">${esc(Dr.foot)}</p>`;
}

function bindDyn(){
  document.querySelectorAll("[data-toggle]").forEach(b => b.onclick = () => {
    const ac = document.getElementById("ac-"+b.dataset.toggle); ac.classList.toggle("open");
    b.setAttribute("aria-expanded", ac.classList.contains("open"));
    b.querySelector("span").textContent = ac.classList.contains("open") ? "Hide" : b.dataset.lbl;
  });
  document.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => copy(b.dataset.copy));
  document.querySelectorAll("[data-jump]").forEach(b => b.onclick = () => jump(b.dataset.jump));
}

let tt;
function toast(msg){ const t=document.getElementById("toast"); document.getElementById("toastTxt").textContent=msg; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),3200); }
function copy(txt){
  const done = () => toast(D.toastCopied);
  const fallback = () => { const ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); let copied=false; try{copied=document.execCommand("copy")}catch(e){} ta.remove(); if(copied) done(); else toast("Copy unavailable. Select the phrase below the buttons to copy it."); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(done, fallback); else fallback();
}
function jump(id){
  if (id==="home") window.scrollTo({top:0,behavior:window.matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
  else document.getElementById(id).scrollIntoView({behavior:window.matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
}

renderChrome();

// Segmented filter
document.querySelectorAll(".seg button").forEach((b,i) => b.onclick = () => {
  view = b.dataset.v;
  document.querySelectorAll(".seg button").forEach(x=>{x.classList.toggle("on", x===b); x.setAttribute("aria-pressed", x===b);});
  document.getElementById("thumb").style.transform = `translateX(${i*100}%)`;
  render();
});

// Tab highlight
const tabIds = ["home","ok","team","coming","revenue"];
function onScroll(){
  let cur = "home", nearest = -Infinity;
  // DOM order differs from tab order: select the most recently passed section.
  for (const id of tabIds.slice(1)) {
    const section = document.getElementById(id);
    const top = section.getBoundingClientRect().top + window.scrollY;
    if (top <= window.scrollY + 150 && top > nearest) { nearest = top; cur = id; }
  }
  document.querySelectorAll(".tabs button").forEach(b => {
    b.classList.toggle("on", b.dataset.jump === cur);
    if(b.dataset.jump === cur) b.setAttribute("aria-current", "location");
    else b.removeAttribute("aria-current");
  });
}
window.addEventListener("scroll", onScroll, {passive:true});

// Live countdown to handover (uses the frozen sample clock in data.js)
(function(){
  const now = nowDate();
  const days = Math.max(0, Math.ceil((new Date(D.handoverAt) - now)/86400000));
  document.getElementById("days").textContent = days;
  const parts = Object.fromEntries(new Intl.DateTimeFormat("en-GB",{weekday:"short",day:"numeric",month:"short",timeZone:D.timeZone}).formatToParts(now).map(x=>[x.type,x.value]));
  document.getElementById("today").textContent = `${parts.weekday} ${parts.day} ${parts.month}`;
})();

renderStatic(); render(); onScroll();
</script>
</body>
</html>
